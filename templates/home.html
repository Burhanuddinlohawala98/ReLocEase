<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReLocEase - Add Home</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/header-footer.css">
    <link rel="stylesheet" href="../static/common_css.css">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <div class="navbar">
                    <a href="#main-content" class="nav-link">Skip to the main content</a>
                    <a href="{{url_for('index')}}" class="navbar-brand">
                        <img src="../static/images/ReLocEase - Logo.png" alt="ReLocEase">
                    </a>
                </div>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="row">
        <div class="col-md-12 my-5">
            <main id="main-content">
            <h1 class="text-center mb-5">ReLocEase - Add Home</h1>
                <div class="form_area col-md-6 offset-md-3">
            <form action="/add_home" method="post">
                <div class="mb-2">
                    <label for="district" class="form-label">District</label>
                    <input type="text" class="form-control" placeholder="Enter district name: " id="district" required name="district">
                </div>
                <div class="mb-2">
                    <label for="state" class="form-label">State</label>
                    <input type="text" class="form-control" placeholder="Enter state: " id="state" required name="state">
                </div>
                <div class="mb-2">
                    <label for="address" class="form-label">Address</label>
                    <input type="text" class="form-control" placeholder="Enter full address: " id="address" required name="address">
                </div>
                <div class="mb-2">
                    <label for="rent" class="form-label">Monthly Rent ₹</label>
                    <input type="number" class="form-control" placeholder="Enter monthly rent: " id="rent" required name="rent">
                </div>
                <div class="mb-2">
                    <label for="house_type" class="form-label">House Type</label>
                    <input type="text" class="form-control" placeholder="Enter House Type: " id="house_type" required name="house_type">
                </div>
                <div class="mb-2">
                    <label for="phone" class="form-label">Phone</label>
                    <input type="tel" class="form-control" placeholder="Enter Phone Number: " id="phone" required name="phone" pattern="[0-9]{10,}">
                </div>
                <div class="mb-2">
                    <label for="email" class="form-label">Contact Email</label>
                    <input type="email" class="form-control" placeholder="Enter Contact Email: " id="email" required name="email">
                </div>
                <button class="btn-primary w-100" type="submit">Login</button>
            </form>
            </div>
        </main>
        </div>    
        </div> 
    </div>
    <div class="footer-container bg-dark">
        <div class="col-md-6">
            <a href="{{url_for('index')}}" class="footer-link">
                <img src="../static/images/ReLocEase - Logo.png" alt="ReLocEase" class="foot-img">
            </a>
        </div>
        <div class="col-md-6 social">
            <ul class="mt-5">
                <li><a href="#">Twitter-X</a></li>
                <li><a href="#">Instagram</a></li>
                <li><a href="#">Gmail</a></li>
            </ul>   
        </div> 
    </div>
</body>
</html>
