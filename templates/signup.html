<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReLocEase - Signup</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/header-footer.css">
    <link rel="stylesheet" href="../static/common_css.css">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <div class="navbar">
                    <a href="#main-content" class="nav-link">Skip to the main content</a>
                    <a href="{{url_for('index')}}" class="navbar-brand">
                        <img src="../static/images/ReLocEase - Logo.png" alt="ReLocEase">
                    </a>
                </div>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="row">
        <div class="col-md-12 my-5">
            <main id="main-content">
            <h1 class="text-center mb-5">ReLocEase - Signup</h1>
                <div class="form_area col-md-6 offset-md-3">
            <form action="/signup" method="post">
                <div class="mb-2">
                    <label for="user_name" class="form-label">Name</label>
                    <input type="text" id="user_name" class="form-control" name="name" placeholder="Enter your name">
                </div>
                <div class="mb-2">
                    <label for="user_id" class="form-label">Create User ID</label>
                    <input type="text" class="form-control" placeholder="Enter email/phone: " id="user_id" required name="user_id">
                </div>
                <div class="mb-2">
                    <label for="user_password" class="form-label">Password</label>
                    <input type="text" class="form-control" placeholder="Enter password: " id="user_password" required name="password">
                </div>
                <div class="mb-2">
                    <label for="confirm_password" class="form-label">Confirm Password</label>
                    <input type="text" class="form-control" placeholder="Enter confirm password: " id="confirm_password" required name="confirm_password">
                </div>
                <button class="btn-primary w-100" type="submit">Signup</button>
            </form>
            </div>
        </main>
        </div>    
        </div> 
    </div>
    <div class="footer-container bg-dark">
        <div class="col-md-6">
            <a href="{{url_for('index')}}" class="footer-link">
                <img src="../static/images/ReLocEase - Logo.png" alt="ReLocEase" class="foot-img">
            </a>
        </div>
        <div class="col-md-6 social">
            <ul class="mt-5">
                <li><a href="#">Twitter-X</a></li>
                <li><a href="#">Instagram</a></li>
                <li><a href="#">Gmail</a></li>
            </ul>   
        </div> 
    </div>
</body>
</html>
